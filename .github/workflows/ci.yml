name: CI

# Lint, dbt build (models + data tests) and pytest on the committed offline
# snapshot. No network access to data.cdc.gov is needed.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: make setup PYTHON=python

      - name: Lint (ruff)
        run: make lint

      - name: dbt build (models + data tests)
        run: make dbt-test

      - name: dbt docs (needed by the site smoke test)
        run: make docs

      - name: pytest
        run: make pytest

      - name: Build static site
        run: make site

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            transform/target/run_results.json
            transform/target/manifest.json
          retention-days: 7
